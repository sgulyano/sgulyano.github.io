<style>
/* Layout: field-survey console. Map fills the left, a ruled itinerary sheet sits on the right (stacks under the map on phones). */
:root {
  --bg: #f4f5f2;
  --sheet: #ffffff;
  --ink: #1b2320;
  --ink-2: #4d5a55;
  --ink-3: #7a8681;
  --rule: #dde2de;
  --accent: #0f6b5c;
  --accent-ink: #ffffff;
  --land: #ecefe9;
  --road: #ffffff;
  --road-case: #c9cfca;
  --path: #9aa59f;
  --water: #b5d5e3;
  --rail: #8c8f8c;
  --label: #55615c;
  --casing: #ffffff;
  --connect: #6f7a75;
  --warn: #b85c00;
  --warn-bg: #fff1df;
  --opt-bg: #e8effb;
  --opt-ink: #23509a;
  --film-bg: #e6f2ee;
  --film-ink: #0f5b4e;
  --con-bg: #eef0ee;
  --con-ink: #55615c;
  --shadow: 0 1px 2px rgba(20, 30, 25, .08), 0 4px 16px rgba(20, 30, 25, .06);
  --f-display: "Anuphan", "IBM Plex Sans Thai", "Leelawadee UI", "Noto Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", "Leelawadee UI", "Noto Sans Thai", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111513; --sheet: #181d1b; --ink: #e6ebe8; --ink-2: #aab6b0; --ink-3: #7f8b86; --rule: #2a312e;
    --accent: #43c2a8; --accent-ink: #0b1411;
    --land: #151a18; --road: #303835; --road-case: #232a27; --path: #4f5a55; --water: #1d3b4a; --rail: #5b605d; --label: #93a19b;
    --casing: #0d1110; --connect: #8d9893; --warn: #ffad5c; --warn-bg: #3a2610;
    --opt-bg: #18263d; --opt-ink: #9cbcf5; --film-bg: #12302a; --film-ink: #7fdcc6; --con-bg: #222826; --con-ink: #a2aea9;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111513; --sheet: #181d1b; --ink: #e6ebe8; --ink-2: #aab6b0; --ink-3: #7f8b86; --rule: #2a312e;
  --accent: #43c2a8; --accent-ink: #0b1411;
  --land: #151a18; --road: #303835; --road-case: #232a27; --path: #4f5a55; --water: #1d3b4a; --rail: #5b605d; --label: #93a19b;
  --casing: #0d1110; --connect: #8d9893; --warn: #ffad5c; --warn-bg: #3a2610;
  --opt-bg: #18263d; --opt-ink: #9cbcf5; --film-bg: #12302a; --film-ink: #7fdcc6; --con-bg: #222826; --con-ink: #a2aea9;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { display: grid; grid-template-rows: auto 1fr; height: 100%; }
header.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px;
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule); background: var(--sheet);
}
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 19px; line-height: 1.2; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
.brand p { margin: 0; color: var(--ink-2); font-size: 12.5px; }
.filter { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 11px;
  border: 1px solid var(--rule); border-radius: 999px; background: var(--sheet); cursor: pointer;
  font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums;
}
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--sheet), 0 0 0 3px var(--c); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.chip[aria-pressed="true"] .dot { box-shadow: 0 0 0 2px var(--ink), 0 0 0 3px var(--c); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; min-height: 0; }
#map { min-height: 0; background: var(--land); }
.leaflet-container { background: var(--land); font-family: var(--f-body); }
.sheet { background: var(--sheet); border-left: 1px solid var(--rule); overflow-y: auto; min-width: 0; }
.sheet-inner { padding-block: 16px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
@media (max-width: 860px) {
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  #map { height: 58vh; min-height: 340px; }
  .sheet { border-left: 0; border-top: 1px solid var(--rule); overflow: visible; }
  .filter { margin-left: 0; }
}

.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin: 0 0 6px; }
h2.gtitle { font-family: var(--f-display); font-size: 22px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 10px; line-height: 1.2; }
h2.gtitle .swatch { width: 14px; height: 14px; border-radius: 4px; background: var(--c); flex: none; }
h3 { font-family: var(--f-display); font-size: 15px; font-weight: 600; margin: 0 0 8px; }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.stats div { padding: 8px 10px; border-right: 1px solid var(--rule); min-width: 0; }
.stats div:last-child { border-right: 0; }
.stats b { display: block; font-family: var(--f-mono); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
.stats span { font-size: 11.5px; color: var(--ink-2); }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats div:nth-child(2) { border-right: 0; } .stats div:nth-child(-n+2) { border-bottom: 1px solid var(--rule); } }

.endpoint { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; }
.endpoint .badge { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: var(--c); }
.endpoint .badge.fin { background: var(--ink); color: var(--sheet); }
.endpoint .nm { font-weight: 600; }
.coord { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.coord a { font-family: var(--f-body); font-size: 12.5px; }

.legs { display: flex; flex-direction: column; gap: 6px; }
.leg { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; text-decoration: none; color: var(--ink); }
.leg:hover { border-color: var(--accent); }
.leg .lk { font-weight: 600; white-space: nowrap; }
.leg .ls { color: var(--ink-2); font-size: 12.5px; min-width: 0; }
.leg .go { margin-left: auto; font-size: 12.5px; color: var(--accent); white-space: nowrap; font-weight: 600; }
.leg.foot { border-style: dashed; background: var(--warn-bg); }
.leg.foot .go { color: var(--warn); }

ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ol.steps li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule); cursor: pointer; }
ol.steps li:first-child { border-top: 0; }
ol.steps li:hover .txt, ol.steps li.on .txt { color: var(--ink); }
ol.steps li.on { background: linear-gradient(90deg, color-mix(in srgb, var(--c) 10%, transparent), transparent); }
.num { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--c); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--ink); background: var(--sheet); }
li.k-connect .num { border-style: dashed; border-color: var(--connect); }
.txt { color: var(--ink); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
.tag { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.tag.film { background: var(--film-bg); color: var(--film-ink); }
.tag.optional { background: var(--opt-bg); color: var(--opt-ink); }
.tag.connect { background: var(--con-bg); color: var(--con-ink); }
.tag.dist { background: transparent; color: var(--ink-2); font-family: var(--f-mono); font-weight: 400; padding-left: 0; }
.note { margin-top: 6px; font-size: 12.5px; color: var(--warn); background: var(--warn-bg); padding: 6px 9px; border-radius: 6px; }

.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--sheet); cursor: pointer; font-weight: 600; font-size: 13px; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .5; cursor: default; }
.status { font-size: 12.5px; color: var(--ink-2); min-height: 1.2em; }

table.ov { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.ovwrap { overflow-x: auto; }
table.ov th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 6px 6px; border-bottom: 1px solid var(--rule); }
table.ov td { padding: 8px 6px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.ov tr { cursor: pointer; }
table.ov tr:hover td { background: color-mix(in srgb, var(--accent) 6%, transparent); }
table.ov td.n { font-family: var(--f-mono); text-align: right; white-space: nowrap; }
table.ov th.n { text-align: right; }
.gcell { display: flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
.gcell i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); display: inline-block; }
.se { font-size: 12px; color: var(--ink-2); }

.glist { display: flex; flex-direction: column; gap: 6px; }
.grow { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; align-items: baseline; text-align: left; padding: 9px 11px; border: 1px solid var(--rule); border-left: 4px solid var(--c); border-radius: 8px; background: var(--sheet); cursor: pointer; }

<script>
(function () {
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const fmtM = m => m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m';
  const fmtLL = ll => ll[0].toFixed(5) + ', ' + ll[1].toFixed(5);
  const gm = ll => 'https://www.google.com/maps/search/?api=1&query=' + ll[0].toFixed(6) + ',' + ll[1].toFixed(6);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const FILM_PACE_KMH = 2;   // walking while filming both sides

  // ---------- map + basemap
  const map = L.map('map', { zoomControl: true, minZoom: 14, maxZoom: 19, preferCanvas: false, attributionControl: true })
    .setView([10.4945, 99.1810], 15);
  map.attributionControl.setPrefix(false).addAttribution('Street data © OpenStreetMap contributors');
  const baseR = L.canvas({ padding: 0.5 });
  const base = { water: [], major: [], minor: [], path: [], rail: [], case: [] };
  function drawBase() {
    BASE.water.forEach(r => base.water.push(L.polygon(r, { renderer: baseR, stroke: false, fillOpacity: 1, interactive: false }).addTo(map)));
    BASE.rail.forEach(l => base.rail.push(L.polyline(l, { renderer: baseR, weight: 2, dashArray: '6 4', interactive: false }).addTo(map)));
    BASE.path.forEach(l => base.path.push(L.polyline(l, { renderer: baseR, weight: 1, dashArray: '2 3', interactive: false }).addTo(map)));
    BASE.minor.concat(BASE.major).forEach(l => base.case.push(L.polyline(l, { renderer: baseR, interactive: false }).addTo(map)));
    BASE.minor.forEach(l => base.minor.push(L.polyline(l, { renderer: baseR, interactive: false }).addTo(map)));
    BASE.major.forEach(l => base.major.push(L.polyline(l, { renderer: baseR, interactive: false }).addTo(map)));
  }
  function styleBase() {
    const z = map.getZoom(), k = Math.pow(2, z - 16);
    base.water.forEach(p => p.setStyle({ fillColor: css('--water') }));
    base.rail.forEach(p => p.setStyle({ color: css('--rail') }));
    base.path.forEach(p => p.setStyle({ color: css('--path'), weight: Math.max(0.8, 1.2 * k) }));
    const nMinor = BASE.minor.length;
    base.case.forEach((p, i) => p.setStyle({ color: css('--road-case'), weight: (i < nMinor ? 5 : 8) * Math.max(0.55, k) }));
    base.minor.forEach(p => p.setStyle({ color: css('--road'), weight: 3.2 * Math.max(0.55, k) }));
    base.major.forEach(p => p.setStyle({ color: css('--road'), weight: 5.5 * Math.max(0.55, k) }));
  }
  drawBase();
  const labels = L.layerGroup(BASE.labels.map(([en, th, lat, lon]) => L.marker([lat, lon], {
    interactive: false, keyboard: false,
    icon: L.divIcon({ className: 'st-label', html: esc(en) + (th ? ' · ' + esc(th) : ''), iconSize: null })
  })));
  const pois = L.layerGroup(BASE.poi.map(([nm, lat, lon]) => L.marker([lat, lon], {
    interactive: false, keyboard: false, icon: L.divIcon({ className: 'poi', html: esc(nm), iconSize: null, iconAnchor: [4, 6] })
  }))).addTo(map);
  function zoomLayers() { if (map.getZoom() >= 17) labels.addTo(map); else labels.remove(); styleBase(); }
  map.on('zoomend', zoomLayers);

  // ---------- routes
  const routeR = L.svg({ padding: 0.5 });
  const groups = ROUTES.map(r => {
    const lg = L.layerGroup(); const casing = L.layerGroup(); const lines = [];
    r.steps.forEach(s => {
      const isCon = s.kind === 'connect';
      if (!isCon) casing.addLayer(L.polyline(s.coords, { renderer: routeR, weight: 9, opacity: 1, lineCap: 'round', lineJoin: 'round', interactive: false, className: 'casing' }));
      const pl = L.polyline(s.coords, {
        renderer: routeR, color: isCon ? null : r.color, weight: isCon ? 3 : 5, opacity: 1,
        dashArray: isCon ? '2 7' : (s.kind === 'optional' ? '9 7' : null), lineCap: 'round', lineJoin: 'round'
      });
      pl.on('click', () => select(r.group, s.n));
      pl._kind = s.kind; lines.push(pl); lg.addLayer(pl);
    });
    return { r, lg, casing, lines, bounds: L.latLngBounds(r.steps.flatMap(s => s.coords)) };
  });
  const allBounds = groups.reduce((b, g) => b.extend(g.bounds), L.latLngBounds(groups[0].bounds.getSouthWest(), groups[0].bounds.getNorthEast()));
  const markers = L.layerGroup().addTo(map);
  function styleRoutes() {
    groups.forEach(g => {
      g.casing.eachLayer(l => l.setStyle({ color: css('--casing') }));
      g.lines.forEach(l => { if (l._kind === 'connect') l.setStyle({ color: css('--connect') }); });
    });
  }
  function divMk(cls, html, c, ll, title) {
    return L.marker(ll, { title: title || '', keyboard: false, icon: L.divIcon({ className: 'mk ' + cls, html: '<span style="--c:' + c + '">' + html + '</span>', iconSize: null }) });
  }

  // ---------- UI
  const filter = document.getElementById('filter');
  const sheet = document.getElementById('sheet');
  let current = 'all', activeStep = null, highlight = null;
  function chip(label, val, c) {
    const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.dataset.val = val; b.id = 'chip-' + val;
    b.innerHTML = (c ? '<span class="dot" style="--c:' + c + '"></span>' : '') + label;
    b.setAttribute('aria-pressed', 'false'); b.addEventListener('click', () => select(val === 'all' ? 'all' : +val));
    filter.appendChild(b);
  }
  chip('All groups', 'all');
  ROUTES.forEach(r => chip('G' + r.group, r.group, r.color));

  function legendHTML() {
    const ln = (dash, w, col) => '<svg width="44" height="10" viewBox="0 0 44 10" aria-hidden="true"><line x1="3" y1="5" x2="41" y2="5" stroke="var(--casing)" stroke-width="' + (w + 4) + '" stroke-linecap="round"' + (col === 'var(--connect)' ? ' stroke-opacity="0"' : '') + '/><line x1="3" y1="5" x2="41" y2="5" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/></svg>';
    return '<div class="legend">' +
      ln('', 5, 'var(--accent)') + '<span>Required street (red on your map): film both sides</span>' +
      ln('9 7', 5, 'var(--accent)') + '<span>Optional street (blue on your map): film if time allows</span>' +
      ln('2 7', 3, 'var(--connect)') + '<span>Connecting walk: no filming needed</span>' +
      '<svg width="44" height="22" viewBox="0 0 44 22" aria-hidden="true"><rect x="12" y="1" width="20" height="20" rx="4" fill="var(--warn)"/><text x="22" y="16" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="sans-serif">!</text></svg><span>Stretch Google Maps cannot route: follow this map on foot</span>' +
      '</div>';
  }
  function cleanText(t) { return t.replace(/\s*\[[^\]]*\]/g, ''); }

  function renderAll() {
    const tot = ROUTES.reduce((a, r) => ({ f: a.f + r.film_m, o: a.o + r.optional_m, c: a.c + r.connect_m }), { f: 0, o: 0, c: 0 });
    const rows = ROUTES.map(r => '<button type="button" class="grow" data-g="' + r.group + '" style="--c:' + r.color + '"><span class="gcell"><i></i>Group ' + r.group + '</span>' +
      '<span class="gnums">' + fmtM(r.film_m) + ' req · ' + fmtM(r.optional_m) + ' opt · <b>' + fmtM(r.total_m) + '</b></span>' +
      '<span class="se"><b>Start</b> ' + esc(r.start.name) + '</span><span class="se"><b>Finish</b> ' + esc(r.end.name) + '</span></button>').join('');
    const flags = [];
    ROUTES.forEach(r => r.steps.forEach(s => { if (s.nogoogle) flags.push('<li><b>G' + r.group + ', step ' + s.n + ':</b> ' + esc(s.lab[0]) + ' (' + fmtM(s.L) + '). ' + esc(s.notes[0] || '') + '</li>'); }));
    sheet.innerHTML =
      '<section><p class="eyebrow">Overview</p><h2 class="gtitle">10 one-way routes</h2>' +
      '<p class="muted small" style="margin:6px 0 0">Every street marked red is covered exactly once, and every blue street is included as optional. No route asks a group to stop and walk back along a street it has just filmed. Each group is dropped at its start and picked up at its finish. Totals include short connecting walks.</p></section>' +
      '<section class="stats" aria-label="All groups">' +
      '<div><b>' + fmtM(tot.f) + '</b><span>required</span></div><div><b>' + fmtM(tot.o) + '</b><span>optional</span></div>' +
      '<div><b>' + fmtM(tot.c) + '</b><span>connecting</span></div><div><b>' + fmtM(tot.f + tot.o + tot.c) + '</b><span>all walking</span></div></section>' +
      '<section><h3>Groups</h3><div class="glist">' + rows + '</div>' +
      '<p class="muted small">Select a group above, or tap its line on the map, for the junction-by-junction itinerary and Google Maps links.</p></section>' +
      '<section><h3>Map key</h3>' + legendHTML() + '</section>' +
      '<section><h3>Stretches Google Maps can’t route exactly</h3><ul class="flags small">' + flags.join('') + '</ul></section>' +
      '<section class="actions"><button class="btn" type="button" id="dl-all" hidden>Download all routes (CSV for Google My Maps)</button><span class="status" id="dl-status" role="status"></span></section>';
    sheet.querySelectorAll('.grow').forEach(b => b.addEventListener('click', () => select(+b.dataset.g)));
    wireDownload('dl-all', 'chumphon-sidewalk-routes-10-groups.csv', () => csvFor(ROUTES));
  }

  function renderGroup(r) {
    const mins = Math.round((r.total_m / 1000) / FILM_PACE_KMH * 60);
    const legs = r.legs.map((lg, i) => {
      const st = lg.steps.length > 1 ? 'Steps ' + lg.steps[0] + '–' + lg.steps[lg.steps.length - 1] : 'Step ' + lg.steps[0];
      const L = r.steps.filter(s => lg.steps.includes(s.n)).reduce((a, s) => a + s.L, 0);
      return lg.google
        ? '<a class="leg" href="' + esc(lg.url) + '" target="_blank" rel="noopener"><span class="lk">Leg ' + (i + 1) + '</span><span class="ls">' + st + ' · ' + fmtM(L) + '</span><span class="go">Open in Google Maps ↗</span></a>'
        : '<a class="leg foot" href="' + esc(gm(lg.pts[lg.pts.length - 1])) + '" target="_blank" rel="noopener"><span class="lk">Leg ' + (i + 1) + '</span><span class="ls">' + st + ' · ' + fmtM(L) + ' · on foot, follow this map</span><span class="go">End pin ↗</span></a>';
    }).join('');
    const steps = r.steps.map(s => {
      const tag = s.kind === 'film' ? '<span class="tag film">Film</span>' : s.kind === 'optional' ? '<span class="tag optional">Optional</span>' : '<span class="tag connect">Connect only</span>';
      const notes = (s.notes || []).map(n => '<div class="note">' + esc(n) + '</div>').join('');
      return '<li class="k-' + s.kind + '" data-n="' + s.n + '" tabindex="0" style="--c:' + r.color + '"><span class="num">' + s.n + '</span><div><div class="txt">' + esc(cleanText(s.text)) + '</div><div class="tags">' + tag + '<span class="tag dist">' + fmtM(s.L) + '</span></div>' + notes + '</div></li>';
    }).join('');
    sheet.innerHTML =
      '<section style="--c:' + r.color + '"><p class="eyebrow">Group itinerary</p><h2 class="gtitle"><span class="swatch"></span>Group ' + r.group + '</h2></section>' +
      '<section class="stats"><div><b>' + fmtM(r.film_m) + '</b><span>required</span></div><div><b>' + fmtM(r.optional_m) + '</b><span>optional</span></div><div><b>' + fmtM(r.connect_m) + '</b><span>connecting</span></div><div><b>' + fmtM(r.total_m) + '</b><span>total · ~' + mins + ' min*</span></div></section>' +
      '<section class="endpoint" style="--c:' + r.color + '"><span class="badge">S</span><div><div class="eyebrow" style="margin:0">Start (drop-off)</div><div class="nm">' + esc(r.start.name) + '</div><div class="coord"><span>' + fmtLL(r.start.ll) + '</span><a href="' + gm(r.start.ll) + '" target="_blank" rel="noopener">Pin in Google Maps ↗</a></div></div></section>' +
      '<section><h3>Google Maps walking links</h3><div class="legs">' + legs + '</div><p class="muted small" style="margin:6px 0 0">Each link pins the junctions along that leg, so Google walks the same streets. Dashed legs are not in Google Maps.</p></section>' +
      '<section><h3>Step by step</h3><ol class="steps" id="steps">' + steps + '</ol></section>' +
      '<section class="endpoint" style="--c:' + r.color + '"><span class="badge fin">F</span><div><div class="eyebrow" style="margin:0">Finish (pick-up)</div><div class="nm">' + esc(r.end.name) + '</div><div class="coord"><span>' + fmtLL(r.end.ll) + '</span><a href="' + gm(r.end.ll) + '" target="_blank" rel="noopener">Pin in Google Maps ↗</a></div></div></section>' +
      '<section class="actions"><button class="btn primary" type="button" id="copy">Copy itinerary text</button><button class="btn" type="button" id="dl-one" hidden>Download route (CSV for Google My Maps)</button><span class="status" id="dl-status" role="status"></span></section>' +
      '<p class="muted small" style="margin:0">* Time assumes about ' + FILM_PACE_KMH + ' km/h while filming. Distances are measured along the mapped streets.</p>' +
      '<section><h3>Map key</h3>' + legendHTML() + '</section>';
    sheet.querySelectorAll('#steps li').forEach(li => {
      li.addEventListener('click', () => focusStep(r, +li.dataset.n));
      li.addEventListener('keydown', e => { if (e.key === 'Enter') focusStep(r, +li.dataset.n); });
    });
    document.getElementById('copy').addEventListener('click', () => copyText(r));
    wireDownload('dl-one', 'chumphon-10-groups-route-G' + r.group + '.csv', () => csvFor([r]));
  }

  function itineraryText(r) {
    const lines = ['Chumphon sidewalk filming – Group ' + r.group,
      'Required ' + fmtM(r.film_m) + ' · optional ' + fmtM(r.optional_m) + ' · connecting ' + fmtM(r.connect_m) + ' · total ' + fmtM(r.total_m),
      '', 'START: ' + r.start.name + ' (' + fmtLL(r.start.ll) + ') ' + gm(r.start.ll), ''];
    r.steps.forEach(s => lines.push(s.n + '. ' + s.text));
    lines.push('', 'FINISH: ' + r.end.name + ' (' + fmtLL(r.end.ll) + ') ' + gm(r.end.ll), '', 'Google Maps legs:');
    r.legs.forEach((lg, i) => lines.push('Leg ' + (i + 1) + (lg.google ? ': ' + lg.url : ': on foot (not in Google Maps), follow the route map')));
    return lines.join('\n');
  }
  function copyText(r) {
    const st = document.getElementById('dl-status'); const t = itineraryText(r);
    const fallback = () => {
      const ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', ''); ta.style.width = '100%'; ta.style.minHeight = '160px';
      st.textContent = 'Copying is blocked here. Select the text below and copy it.'; st.after(ta); ta.select();
    };
    try { navigator.clipboard.writeText(t).then(() => { st.textContent = 'Itinerary copied. Paste it into your group chat.'; }, fallback); } catch (e) { fallback(); }
  }
  function wkt(coords) { return 'LINESTRING (' + coords.map(c => c[1].toFixed(6) + ' ' + c[0].toFixed(6)).join(', ') + ')'; }
  function q(s) { return '"' + String(s).replace(/"/g, '""') + '"'; }
  function csvFor(list) {
    const rows = ['WKT,name,group,kind,length_m,description'];
    list.forEach(r => {
      rows.push([q('POINT (' + r.start.ll[1] + ' ' + r.start.ll[0] + ')'), q('G' + r.group + ' START'), r.group, 'start', 0, q(r.start.name)].join(','));
      r.steps.forEach(s => rows.push([q(wkt(s.coords)), q('G' + r.group + ' step ' + s.n + ': ' + s.lab[0]), r.group, s.kind + (s.nogoogle ? ' (not in Google Maps)' : ''), s.L, q(s.text)].join(',')));
      rows.push([q('POINT (' + r.end.ll[1] + ' ' + r.end.ll[0] + ')'), q('G' + r.group + ' FINISH'), r.group, 'finish', 0, q(r.end.name)].join(','));
    });
    return '﻿' + rows.join('\r\n');
  }
  let downloads = null;
  function wireDownload(id, filename, make) {
    const b = document.getElementById(id); if (!b) return;
    if (downloads) b.hidden = false;
    b.onclick = async () => {
      const st = document.getElementById('dl-status');
      try { await downloads.save({ filename, data: make() }); st.textContent = 'Saved ' + filename + '. In Google My Maps choose Import and pick this file.'; }
      catch (e) { st.textContent = e && e.code === 'declined' ? 'Download cancelled.' : 'Downloads are not available in this view.'; }
    };
  }
  if (window.claude && window.claude.use) {
    window.claude.use('downloads').then(d => { downloads = d; if (d) document.querySelectorAll('#dl-all,#dl-one').forEach(b => b.hidden = false); }).catch(() => {});
  }

  function focusStep(r, n) {
    const s = r.steps.find(x => x.n === n); if (!s) return;
    activeStep = n;
    sheet.querySelectorAll('#steps li').forEach(li => li.classList.toggle('on', +li.dataset.n === n));
    if (highlight) highlight.remove();
    highlight = L.polyline(s.coords, { renderer: routeR, color: r.color, weight: 11, opacity: .35, lineCap: 'round', interactive: false }).addTo(map);
    map.fitBounds(L.latLngBounds(s.coords), { padding: [60, 60], maxZoom: 18 });
    const li = sheet.querySelector('#steps li[data-n="' + n + '"]');
    if (li && window.matchMedia('(max-width: 860px)').matches) document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function select(val, stepN) {
    current = val; activeStep = null;
    if (highlight) { highlight.remove(); highlight = null; }
    filter.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.val === String(val))));
    markers.clearLayers();
    groups.forEach(g => {
      const on = val === 'all' || g.r.group === val;
      if (on) { g.casing.addTo(map); g.lg.addTo(map); } else { g.casing.remove(); g.lg.remove(); }
      g.lines.forEach(l => l.setStyle({ opacity: 1 }));
    });
    // bring the selected route to the front
    groups.forEach(g => { if (val !== 'all' && g.r.group === val) { g.casing.eachLayer(l => l.bringToFront()); g.lines.forEach(l => l.bringToFront()); } });
    if (val === 'all') {
      groups.forEach(g => markers.addLayer(divMk('start', g.r.group, g.r.color, g.r.start.ll, 'Group ' + g.r.group + ' start')
        .on('click', () => select(g.r.group))));
      renderAll();
      map.fitBounds(allBounds, { padding: [24, 24] });
      try { history.replaceState(null, '', '#all'); } catch (e) {}
    } else {
      const g = groups[val - 1], r = g.r;
      r.steps.forEach(s => {
        if (s.n > 1) markers.addLayer(divMk('step', s.n, r.color, s.coords[0], 'Step ' + s.n).on('click', () => focusStep(r, s.n)));
        if (s.nogoogle) { const m = s.coords[Math.floor(s.coords.length / 2)]; markers.addLayer(divMk('warn', '!', r.color, m, 'Not in Google Maps').on('click', () => focusStep(r, s.n))); }
      });
      markers.addLayer(divMk('start', 'S', r.color, r.start.ll, 'Start'));
      markers.addLayer(divMk('fin', 'F', r.color, r.end.ll, 'Finish'));
      renderGroup(r);
      if (stepN) focusStep(r, stepN); else map.fitBounds(g.bounds, { padding: [40, 40] });
      try { history.replaceState(null, '', '#g' + val); } catch (e) {}
      if (!stepN) sheet.parentElement.scrollTop = 0;
    }
  }

  function applyTheme() { styleBase(); styleRoutes(); }
  try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch (e) {}
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  zoomLayers(); styleRoutes();
  const h = (location.hash || '').match(/^#g([1-9]|10)$/);
  select(h ? +h[1] : 'all');
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => map.invalidateSize());
  window.addEventListener('resize', () => map.invalidateSize());
})();
</script>
